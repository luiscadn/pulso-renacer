name: CI
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ficticio:ficticio@localhost:5432/ficticio
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123
      TEAM_CODE: ci-equipo
      ADMIN_CODE: ci-gestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
