name: CI
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ficticio:ficticio@localhost:5432/ficticio
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123
      TEAM_CODE: ci-equipo
      ADMIN_CODE: ci-gestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Opcional y no bloqueante: si falla, no tumba el CI principal. Revisar el reporte en los artefactos.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renacer_e2e
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123
      TEAM_CODE: ci-equipo
      ADMIN_CODE: ci-gestion
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renacer_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run db:seed:demo
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
