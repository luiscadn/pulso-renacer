# Render Blueprint — Pulso Renacer (solo el servicio web).
# Arquitectura: Next.js en Render + Postgres en Neon (externo, us-east-1, plan free sin expiración).
# DATABASE_URL NO está en este archivo: se pega como variable secreta en Render (Environment) con la cadena de conexión de Neon.
# Despliegue: Dashboard de Render → New → Blueprint → elegir este repo → pegar DATABASE_URL, TEAM_CODE y ADMIN_CODE.
# Piloto: web free (US$0). Producción: web "starter" (US$7/mes); Neon free mientras quepa en su límite gratis.
services:
  - type: web
    name: pulso-renacer
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Bogota
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TEAM_CODE
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: DEMO_MODE
        value: "true"


